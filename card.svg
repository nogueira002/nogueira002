<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Ricardo Nogueira — Full Stack Software Engineer, Porto">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.name{font-size:40px;font-weight:700;letter-spacing:-1.2px;fill:#ECEEF0}
.role{font-size:17px;fill:#A3A8AE}
.bio{font-size:16px;fill:#C9CDD2}
.link{font-size:15px;font-weight:600;fill:#A98BF5}
.lab{font-size:13px;fill:#8B9198}
.val{font-size:16px;fill:#ECEEF0}
</style>
<clipPath id="card"><rect x="1" y="1" width="878" height="328" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="880" height="330" fill="#0E1012"/>
<path d="M-10 302 C 220 272, 520 332, 890 290" fill="none" stroke="#A98BF5" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="4 8" stroke-linecap="round">
<animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/></path>
</g>
<rect x="1" y="1" width="878" height="328" rx="18" fill="none" stroke="#2A2E33" stroke-width="1.5"/>
<text x="52" y="96" class="name">Ricardo Nogueira</text>
