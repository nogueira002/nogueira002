<text x="52" y="178" class="bio">I like to design systems before I build them —</text>
<text x="52" y="204" class="bio">and to watch them hold up in production.</text>
<text x="52" y="262" class="link">ricardonogueira.pt ↗</text>
<line x1="500" y1="64" x2="500" y2="266" stroke="#2A2E33"/>
<text x="540" y="84" class="lab">Now</text><text x="540" y="106" class="val">Full Stack Developer at Mindforge</text>
<text x="540" y="134" class="lab">Building</text><text x="540" y="156" class="val">MES software and ERP integrations</text>
